    <!-- Esto es lo que se ve cuando alguien pega el link en Instagram, WhatsApp
         o Facebook. Necesita URLs absolutas: Vite no reescribe el contenido de
         las meta con el `base`, y las redes tampoco resuelven rutas relativas.
         Si el sitio cambia de dominio hay que actualizarlas acá a mano — hasta
         el 10/8/2026 apuntaban al viejo malusa15.github.io, que ya da 404, así
         que el preview salía sin imagen.

         La imagen es una tarjeta 1200x630 (la medida que piden las tres redes)
         armada a propósito para esto, y no el wordmark suelto: es un PNG
         transparente y sobre el fondo negro de WhatsApp no se veía. -->
    <meta property="og:site_name" content="Cultura.Cute" />
    <meta property="og:title" content="Cultura.Cute — piezas únicas" />
    <meta
      property="og:description"
      content="Prendas artesanales y limitadas, con referencias Y2K y moda alternativa. Mar del Plata."
    />
