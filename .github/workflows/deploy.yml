name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzar el deploy a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos que necesita la action oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se pushea dos veces seguidas, que termine el deploy más nuevo y no se pisen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        # Van como variables y no como secrets a propósito: la anon key está
        # diseñada para viajar en el JavaScript del sitio, así que igual termina
        # siendo pública. Lo que protege la base son las políticas de RLS.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
